{% extends "base/base.html" %}

{% block content %}
<style>
  .custom-chart {
    width: 100% !important;
    height: 400px !important;
  }
</style>

<div class="page-header">
  <h1 class="page-title">Dashboard</h1>
</div>

<form method="POST">
  {% csrf_token %}

  <div class="row mb-4">
    <div class="col-md-3">
      <select class="form-control" name="chart">
        <option value="Commodity" {% if chart_type == "Commodity" %}selected{% endif %}>
          Commodity Sales
        </option>

        <option value="Product" {% if chart_type == "Product" %}selected{% endif %}>
          Product Sales
        </option>
      </select>
    </div>

    <div class="col-md-2">
      <button class="btn btn-success">Show</button>
    </div>
  </div>
</form>

<div class="row">
  <div class="col-md-6 mb-4">
    <div class="card">
      <div class="card-header">Sales Graph</div>

      <div class="card-body">
        <canvas id="salesChart" style="max-height: 350px;"></canvas>
      </div>
    </div>
  </div>

  <div class="col-md-6 mb-4">
    <div class="card">
      <div class="card-header">Stock Proportion</div>

      <div class="card-body">
        <canvas id="stockChart" style="max-height: 350px;"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  new Chart(document.getElementById("salesChart"), {
      type: "bar",
      data: {
          labels: {{ sales_labels|safe }},
          datasets: [{
              label: "Total Sales",
              data: {{ sales_values|safe }},
              borderWidth: 1,

              backgroundColor: [
                  "rgba(255, 99, 132, 0.6)",
                  "rgba(54, 162, 235, 0.6)",
                  "rgba(255, 206, 86, 0.6)",
                  "rgba(75, 192, 192, 0.6)",
                  "rgba(153, 102, 255, 0.6)",
                  "rgba(255, 159, 64, 0.6)",
                  "rgba(199, 199, 199, 0.6)",
                  "rgba(83, 102, 255, 0.6)",
                  "rgba(40, 167, 69, 0.6)",
                  "rgba(220, 53, 69, 0.6)"
              ],

              borderColor: [
                  "rgba(255, 99, 132, 1)",
                  "rgba(54, 162, 235, 1)",
                  "rgba(255, 206, 86, 1)",
                  "rgba(75, 192, 192, 1)",
                  "rgba(153, 102, 255, 1)",
                  "rgba(255, 159, 64, 1)",
                  "rgba(199, 199, 199, 1)",
                  "rgba(83, 102, 255, 1)",
                  "rgba(40, 167, 69, 1)",
                  "rgba(220, 53, 69, 1)"
              ]
          }]
      },
      options: {
          responsive: true,
          scales: {
              y: {
                  beginAtZero: true
              }
          }
      }
  });

  new Chart(document.getElementById("stockChart"), {
    type: "pie",
    data: {
      labels: {{ stock_labels|safe }},
      datasets: [{
        label: "Current Stock",
        data: {{ stock_values|safe }}
      }]
    },
    options: {
      responsive: true
    }
  });
</script>
{% endblock %}
