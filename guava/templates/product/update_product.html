{% extends "base/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Update Data product</h1>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active" aria-current="page"><a class="text-muted" href="{% url 'read_product' %}">Data product</a></li>
            <li class="breadcrumb-item"><a href="{%  url 'update_product' item.product_id % }">Update Product</a></li>
        </ol>
    </nav>
</div>
<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <form class="form-sample" method="post">
                    {% csrf_token %}
                                                            
                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Product Name</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="text" name="product_name" value="{{product.product_name}}" required>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Product Price</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="text" name="selling_price" value="{{product.selling_price}}" required>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Commodity Used</label>
                        <div class="col-sm-9">
                            <select class="form-control" name="commodity_id">
                            {% for i in commodity_obj %}
                                <option value="{{ i.commodity_id }}"
                                    {% if product.commodity_id.commodity_id == i.commodity_id %}
                                        selected
                                    {% endif %}>
                                    {{ i.commodity_name }}
                                </option>
                            {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label">Commodity Quantity</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="text" name="commodity_quantity" value="{{product.commodity_quantity}}" required>
                        </div>
                    </div>

 
                    <button type="submit" class="btn btn-success btn-icon-text">
                        <i class="mdi mdi-file-check btn-icon-prepend"></i> Submit </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
