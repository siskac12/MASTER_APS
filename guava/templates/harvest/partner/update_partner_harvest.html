{% extends "base/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Update Partner Harvest</h1>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active" aria-current="page"><a class="text-muted" href="{% url 'read_partner_harvest' %}">Data Partner Harvest</a></li>
            <li class="breadcrumb-item"><a href="">Update Partner Harvest</a></li>
        </ol>
    </nav>
</div>
<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <form class="form-sample" method="post">
                    {% csrf_token %}
                    <h1 class="card-title">Partner Harvest</h1>
                    <div class="form-group row">
                        <label for="partner_name" class="col-sm-3 col-form-label">Partner Name</label>
                        <div class="col-sm-9">
                            <select class="form-control" name="partner_name" id="partner_name" required>
                                {% for item in partners %}
                                {% if item.partner_name == detail_obj.partner_harvest_id.partner_id.partner_name %}
                                <option selected value="{{item.partner_id}}">{{item.partner_name}}</option>
                                {% else %}
                                <option value="{{item.partner_id}}">{{item.partner_name}}</option>
                                {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="harvest_date" class="col-sm-3 col-form-label">Harvest Date</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="date" name="harvest_date" id="harvest_date" value="{{harvest_date}}" required>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="commodity" class="col-sm-3 col-form-label">Commodity</label>
                        <div class="col-sm-9">
                            <select class="form-control" name="commodity" id="commodity">
                                {% for item in commodities %}
                                {% if item == detail_obj.commodity_id %}
                                <option selected value="{{item.commodity_id}}">{{item}}</option>
                                {% else %}
                                <option value="{{item.commodity_id}}">{{item}}</option>
                                {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label" for="quantity">Quantity</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="number" step="0.01" name="quantity" id="quantity" value="{{detail_obj.quantity}}" placeholder="Quantity (kg)" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-icon-text">
                        <i class="mdi mdi-file-check btn-icon-prepend"></i> Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
