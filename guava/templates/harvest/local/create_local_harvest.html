{% extends "base/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Create Data Local Harvest</h1>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active" aria-current="page"><a class="text-muted" href="{% url 'read_local_harvest' %}">Data Local Harvest</a></li>
            <li class="breadcrumb-item"><a href="{% url 'create_local_harvest' %}">Create Local Harvest</a></li>
        </ol>
    </nav>
</div>

<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <form class="form-sample" method="post">
                    {% csrf_token %}
                    <h1 class="card-title">Local Harvest</h1>
                    <div class="form-group row">
                        <label for="harvest_date" class="col-sm-3 col-form-label">Harvest Date</label>
                        <div class="col-sm-9">
                            <input type="date" class="form-control" name="harvest_date" id="harvest_date" required>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-auto">
                            <button type="button" class="btn btn-inverse-success btn-icon-text btn-sm" onclick="addlocal_harvest()">
                                <i class="mdi mdi-plus btn-icon-prepend"></i> Add Detail
                            </button>
                        </div>
                    </div>
                    <div id="adddetail">
                        <div class="detail-row border-top pt-3 mb-4">
                            <h3 class="card-title">Local Harvest Detail 1</h3>
                            <div class="form-group row">
                                <label for="commodity" class="col-sm-3 col-form-label">Commodity</label>
                                <div class="col-sm-9">
                                    <select class="form-control commodity" name="commodity" id="commodity">
                                        {% for item in all_commodities %}
                                        <option value="{{ item.commodity_id }}">{{ item }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="quantity" class="col-sm-3 col-form-label">Quantity</label>
                                <div class="col-sm-9">
                                    <input class="form-control" type="number" step="0.01" name="quantity" id="quantity" placeholder="Quantity (kg)" required>
                                </div>
                            </div>
                            <button class="btn btn-inverse-danger btn-icon-text btn-sm" type="button" onclick="deleterow(this)">
                                <i class="mdi mdi-close btn-icon-prepend"></i> Delete Detail
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success btn-icon-text">
                        <i class="mdi mdi-file-check btn-icon-prepend"></i> Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% block javascripts %}
<script>
    function addlocal_harvest() {
        const rows = document.querySelectorAll('#adddetail .detail-row');
        const angka = rows.length + 1;
        const baris = document.createElement('div');
        baris.className = 'detail-row border-top pt-3 mb-4';
        baris.innerHTML = `
            <h3 class="card-title">Local Harvest Detail ${angka}</h3>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Commodity</label>
                <div class="col-sm-9">
                    <select class="form-control commodity" name="commodity" id="commodity">
                        {% for item in all_commodities %}
                        <option value="{{ item.commodity_id }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Quantity</label>
                <div class="col-sm-9">
                    <input class="form-control" type="number" step="0.01" name="quantity" id="quantity" placeholder="Quantity (kg)" required>
                </div>
            </div>
            <button class="btn btn-inverse-danger btn-icon-text btn-sm" type="button" onclick="deleterow(this)">
                <i class="mdi mdi-close btn-icon-prepend"></i> Delete Detail
            </button>
        `;
        document.getElementById('adddetail').appendChild(baris);
        updateRowNumbers();
    }

    function deleterow(button) {
        button.closest('.detail-row').remove();
        updateRowNumbers();
    }

    function updateRowNumbers() {
        const rows = document.querySelectorAll('#adddetail .detail-row');
        rows.forEach((row, index) => {
            const title = row.querySelector('h3');
            title.textContent = `Local Harvest Detail ${index + 1}`;
        });
    }
</script>
{% endblock javascripts %}
{% endblock %}
