{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta tag yang diperlukan -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Bumi Aji</title>
  <!-- plugins:css -->
  <link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/css/vendor.bundle.base.css' %}">
  <!-- endinject -->
  <!-- Plugin css untuk halaman ini -->
  <link rel="stylesheet" href="{% static 'assets/vendors/jvectormap/jquery-jvectormap.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/flag-icon-css/css/flag-icon.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/owl-carousel-2/owl.carousel.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/owl-carousel-2/owl.theme.default.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css' %}">
  <!-- End plugin css untuk halaman ini -->
  <!-- inject:css -->
  <!-- endinject -->
  <!-- Layout styles -->
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
  <!-- End layout styles -->
  <link rel="shortcut icon" href="{% static 'assets/images/favicon.png' %}">
  <link href="{% static 'assets/vendors/datatables/dataTables.bootstrap4.min.css' %}" rel="stylesheet">
</head>
<style>
  .custom-chart {
      width: 100% !important; 
      height: 400px !important;
  }
</style>
<body>
    <div class="container-scroller">
      {% include 'base/sidebar.html' %}
      <div class="container-fluid page-body-wrapper">
        {% include 'base/navbar.html' %}
        <div class="main-panel">
          <div class="content-wrapper">
            {% include 'base/messages.html' %}
            <div class="page-header">
                <h1 class="page-title">Dashboard</h1>
            </div>
            <form method="POST">
                {% csrf_token %}

                <div class="row mb-4">

                    <div class="col-md-3">
                        <select class="form-control" name="chart">
                            <option value="Commodity"
                                {% if chart_type == "Commodity" %}selected{% endif %}>
                                Commodity Sales
                            </option>

                            <option value="Product"
                                {% if chart_type == "Product" %}selected{% endif %}>
                                Product Sales
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-success">
                            Show
                        </button>
                    </div>

                </div>
            </form>
<div class="row">

    <div class="col-md-6 mb-4">

        <div class="card">

            <div class="card-header">
                Sales Graph
            </div>

            <div class="card-body">

                <canvas id="salesChart"
                        style="max-height:350px;">
                </canvas>

            </div>

        </div>

    </div>



    <div class="col-md-6 mb-4">

        <div class="card">

            <div class="card-header">
                Stock Proportion
            </div>

            <div class="card-body">

                <canvas id="stockChart"
                        style="max-height:350px;">
                </canvas>

            </div>

        </div>

    </div>

</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>

  new Chart(document.getElementById("salesChart"), {
      type: "bar",
      data: {
          labels: {{ sales_labels|safe }},
          datasets: [{
              label: "Total Sales",
              data: {{ sales_values|safe }},
              borderWidth: 1,

              backgroundColor: [
                  "rgba(255, 99, 132, 0.6)",
                  "rgba(54, 162, 235, 0.6)",
                  "rgba(255, 206, 86, 0.6)",
                  "rgba(75, 192, 192, 0.6)",
                  "rgba(153, 102, 255, 0.6)",
                  "rgba(255, 159, 64, 0.6)",
                  "rgba(199, 199, 199, 0.6)",
                  "rgba(83, 102, 255, 0.6)",
                  "rgba(40, 167, 69, 0.6)",
                  "rgba(220, 53, 69, 0.6)"
              ],

              borderColor: [
                  "rgba(255, 99, 132, 1)",
                  "rgba(54, 162, 235, 1)",
                  "rgba(255, 206, 86, 1)",
                  "rgba(75, 192, 192, 1)",
                  "rgba(153, 102, 255, 1)",
                  "rgba(255, 159, 64, 1)",
                  "rgba(199, 199, 199, 1)",
                  "rgba(83, 102, 255, 1)",
                  "rgba(40, 167, 69, 1)",
                  "rgba(220, 53, 69, 1)"
              ]
          }]
      },
      options: {
          responsive: true,
          scales: {
              y: {
                  beginAtZero: true
              }
          }
      }
  });



  new Chart(document.getElementById("stockChart"),{

      type:"pie",

      data:{
          labels: {{ stock_labels|safe }},
          datasets:[{
              label:"Current Stock",
              data: {{ stock_values|safe }}
          }]
      },

      options:{
          responsive:true
      }

  });

  </script>    
    <!-- jQuery pertama kali -->
    <script src="{% static 'assets/vendors/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'assets/js/vendor.bundle.base.js' %}"></script>

    <!-- DataTables -->
    <script src="{% static 'assets/vendors/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'assets/vendors/datatables/dataTables.bootstrap4.min.js' %}"></script>
    <!-- Plugin js untuk halaman ini -->
    <script src="{% static 'assets/vendors/progressbar.js/progressbar.min.js' %}"></script>
    <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap.min.js' %}"></script>
    <script src="{% static 'assets/vendors/jvectormap/jquery-jvectormap-world-mill-en.js' %}"></script>
    <script src="{% static 'assets/vendors/owl-carousel-2/owl.carousel.min.js' %}"></script>
    <!-- End plugin js untuk halaman ini -->
    <!-- inject:js -->
    <script src="{% static 'assets/js/off-canvas.js' %}"></script>
    <script src="{% static 'assets/js/hoverable-collapse.js' %}"></script>
    <script src="{% static 'assets/js/misc.js' %}"></script>
    <script src="{% static 'assets/js/settings.js' %}"></script>
    <script src="{% static 'assets/js/todolist.js' %}"></script>
    <!-- endinject -->
    <!-- Custom js untuk halaman ini -->
    <script src="{% static 'assets/js/dashboard.js' %}"></script>
</html>
