{% extends "base/base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Create Sales Data</h1>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active" aria-current="page"><a class="text-muted" href="{% url 'read_sale' %}">Sales Data</a></li>
            <li class="breadcrumb-item"><a href="{% url 'create_sale' %}">Create Sale</a></li>
        </ol>
    </nav>
</div>

<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <form class="form-sample" method="post">
                    {% csrf_token %}
                    <h1 class="card-title">Sale</h1>
                    <div class="form-group row">
                        <label for="market" class="col-sm-3 col-form-label">Market</label>
                        <div class="col-sm-9">
                            <select class="form-control" name="market" id="market" required>
                                {% for item in market_obj %}
                                <option value="{{ item.market_id }}">{{ item.market_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="date" class="col-sm-3 col-form-label">Date</label>
                        <div class="col-sm-9">
                            <input class="form-control" type="date" name="date" id="date" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-auto">
                            <button type="button" class="btn btn-inverse-success btn-icon-text btn-sm" onclick="addSaleProduct()">
                                <i class="mdi mdi-plus btn-icon-prepend"></i> Add Product
                            </button>
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-inverse-info btn-icon-text btn-sm" onclick="addSaleCommodity()">
                                <i class="mdi mdi-plus btn-icon-prepend"></i> Add Commodity
                            </button>
                        </div>
                    </div>

                    <div id="productDetails"></div>
                    <div id="commodityDetails"></div>

                    <button type="submit" class="btn btn-success btn-icon-text">
                        <i class="mdi mdi-file-check btn-icon-prepend"></i> Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% block javascripts %}
<script>
    function addSaleProduct() {
        const rows = document.querySelectorAll('#productDetails .product-row');
        const angka = rows.length + 1;
        const baris = document.createElement('div');
        baris.className = 'product-row border-top pt-3 mb-4';
        baris.innerHTML = `
            <h3 class="card-title">Sale Product Detail ${angka}</h3>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Product</label>
                <div class="col-sm-9">
                    <select class="form-control product" name="product" required>
                        {% for item in product_obj %}
                        <option value="{{ item.product_id }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Quantity</label>
                <div class="col-sm-9">
                    <input class="form-control" type="number" name="product_quantity" placeholder="Product Quantity" min="1" required>
                </div>
            </div>
            <button class="btn btn-inverse-danger btn-icon-text btn-sm" type="button" onclick="deleteSaleRow(this, 'product')">
                <i class="mdi mdi-close btn-icon-prepend"></i> Delete Detail
            </button>
        `;
        document.getElementById('productDetails').appendChild(baris);
        updateProductNumbers();
    }

    function addSaleCommodity() {
        const rows = document.querySelectorAll('#commodityDetails .commodity-row');
        const angka = rows.length + 1;
        const baris = document.createElement('div');
        baris.className = 'commodity-row border-top pt-3 mb-4';
        baris.innerHTML = `
            <h3 class="card-title">Sale Commodity Detail ${angka}</h3>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Commodity</label>
                <div class="col-sm-9">
                    <select class="form-control commodity" name="commodity" required>
                        {% for item in commodity_obj %}
                        <option value="{{ item.commodity_id }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-3 col-form-label">Quantity</label>
                <div class="col-sm-9">
                    <input class="form-control" type="number" name="commodity_quantity" placeholder="Commodity Quantity (kg)" min="1" required>
                </div>
            </div>
            <button class="btn btn-inverse-danger btn-icon-text btn-sm" type="button" onclick="deleteSaleRow(this, 'commodity')">
                <i class="mdi mdi-close btn-icon-prepend"></i> Delete Detail
            </button>
        `;
        document.getElementById('commodityDetails').appendChild(baris);
        updateCommodityNumbers();
    }

    function deleteSaleRow(button, type) {
        button.closest(type === 'product' ? '.product-row' : '.commodity-row').remove();
        if (type === 'product') {
            updateProductNumbers();
        } else {
            updateCommodityNumbers();
        }
    }

    function updateProductNumbers() {
        const rows = document.querySelectorAll('#productDetails .product-row');
        rows.forEach((row, index) => {
            row.querySelector('h3').textContent = `Sale Product Detail ${index + 1}`;
        });
    }

    function updateCommodityNumbers() {
        const rows = document.querySelectorAll('#commodityDetails .commodity-row');
        rows.forEach((row, index) => {
            row.querySelector('h3').textContent = `Sale Commodity Detail ${index + 1}`;
        });
    }
</script>
{% endblock javascripts %}
{% endblock %}
