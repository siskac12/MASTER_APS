{% extends "base/base.html" %}

{% block content %}

<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active " aria-current="page" ><a class="text-muted" href="{% url 'read_production' %}">Data Production</a></li>
          <li class="breadcrumb-item " ><a  href="">Update Production</a></li>
        </ol>
      </nav>
</div>

<div class="col-12 grid-margin stretch-card">
    <div class="card">
        <div class="card-body">
            <h3 class="card-title">Update Data</h3>
            <form class="form-sample"  method="post">
                {% csrf_token %}
                <style>
                    .readonly-production-field {
                        background-color: #2A3038 !important;
                        border-color: #2c2e33 !important;
                        color: #ffffff !important;
                        opacity: 1;
                    }
                </style>
                <div class="form-group row">
                    <label class="col-sm-3 col-form-label"  for="date">Date</label>
                    <div class="col-sm-9">
                        <input class="form-control readonly-production-field" value="{{ detail.production_id.date }}" id="date" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-3 col-form-label" for="product">Product</label>
                    <div class="col-sm-9">
                        <input class="form-control readonly-production-field" value="{{ detail.product_id.product_name }}" id="product" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-3 col-form-label"  for="product_quantity">Product Quantity</label>
                    <div class="col-sm-9">
                        <input class="form-control readonly-production-field" type="number" value="{{ detail.product_quantity }}" id="product_quantity" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-sm-3 col-form-label" for="status">Status Product</label>
                    <div class="col-sm-9">
                        <select class="form-control" name="status" id="status" required>
                            {% for status in status_choices %}
                            <option value="{{ status }}" {% if detail.status == status %}selected{% endif %}>{{ status }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
         
                <button type="submit" class="btn btn-primary mr-2">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
